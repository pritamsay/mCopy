name: Build and test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Transfer and uninstall-recovery tests
        run: zsh scripts/test.sh
      - name: Check shell scripts
        run: bash -n install.sh uninstall.sh
      - name: Build Apple Silicon and Intel app
        run: zsh scripts/build.sh
      - name: Validate release packaging
        run: |
          zsh scripts/package.sh
          APP_ARCHS="$(lipo -archs dist/myCopy.app/Contents/MacOS/myCopy)"
          EXTENSION_ARCHS="$(lipo -archs dist/myCopy.app/Contents/PlugIns/MyCopyFinder.appex/Contents/MacOS/MyCopyFinder)"
          [[ " $APP_ARCHS " == *" arm64 "* && " $APP_ARCHS " == *" x86_64 "* ]]
          [[ " $EXTENSION_ARCHS " == *" arm64 "* && " $EXTENSION_ARCHS " == *" x86_64 "* ]]
          codesign --verify --deep --strict dist/myCopy.app
